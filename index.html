<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PitchStats Pro - Cricket Match Analytics</title>

    <!-- PWA & Photoshop Favicon -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='90' fill='%230a101d' stroke='%2310b981' stroke-width='20'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' fill='%2334d399' font-family='sans-serif' font-weight='900' font-size='230'>Ps</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='90' fill='%230a101d' stroke='%2310b981' stroke-width='20'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' fill='%2334d399' font-family='sans-serif' font-weight='900' font-size='230'>Ps</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .card-bg { background: #131b2e; border: 1px solid #1e293b; }
        .ps-logo {
            background: linear-gradient(135deg, #0a101d 0%, #020617 100%);
            border: 2px solid #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body class="min-h-screen p-4 max-w-lg mx-auto">

    <!-- Header Section -->
    <header class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
        <div class="flex items-center gap-3">
            <div class="ps-logo w-11 h-11 rounded-xl flex items-center justify-center font-black text-emerald-400 text-xl tracking-tighter select-none">
                Ps
            </div>
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    PitchStats <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-2 py-0.5 rounded font-semibold">PRO</span>
                </h1>
                <p class="text-xs text-slate-400">Advanced Match & Pitch Analytics</p>
            </div>
        </div>
        <button id="pwaInstallBtn" class="hidden text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition-all">
            Install
        </button>
    </header>

    <!-- Inputs Form -->
    <div class="card-bg p-5 rounded-2xl space-y-4 shadow-xl">
        <h2 class="text-sm font-bold uppercase tracking-wider text-emerald-400 border-b border-slate-800 pb-2">Match Conditions</h2>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Temperature (°C)</label>
                <input type="number" id="tempInput" value="32" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Humidity (%)</label>
                <input type="number" id="humidityInput" value="65" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
        </div>

        <div>
            <label class="block text-xs text-slate-400 mb-1">Pitch Type</label>
            <select id="pitchTypeInput" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                <option value="black_soil" selected>Black Soil (Pace & Low Moisture)</option>
                <option value="red_clay">Red Clay (High Bounce & Turn)</option>
                <option value="grassy">Green Grass (Seam Movement)</option>
                <option value="dry_flat">Dry / Flat (Batting Friendly)</option>
            </select>
        </div>

        <div>
            <label class="block text-xs text-slate-400 mb-1">Innings</label>
            <select id="inningsInput" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                <option value="1st">1st Innings (Setting Target)</option>
                <option value="2nd">2nd Innings (Chasing)</option>
            </select>
        </div>

        <button onclick="calculateMetrics()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-500/20 active:scale-95">
            Analyze Pitch & Conditions
        </button>
    </div>

    <!-- Output Section -->
    <div class="card-bg p-5 rounded-2xl space-y-4 shadow-xl mt-6">
        <h2 class="text-sm font-bold uppercase tracking-wider text-emerald-400 border-b border-slate-800 pb-2">Pitch Behavior & Analytics</h2>

        <div class="space-y-3">
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-slate-300">Dew Factor Risk</span>
                    <span id="dewVal" class="font-bold text-amber-400">Moderate</span>
                </div>
                <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden">
                    <div id="dewBar" class="bg-amber-400 h-full rounded-full transition-all duration-500" style="width: 50%;"></div>
                </div>
            </div>

            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-slate-300">Pace & Seam Support</span>
                    <span id="paceVal" class="font-bold text-emerald-400">High</span>
                </div>
                <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden">
                    <div id="paceBar" class="bg-emerald-400 h-full rounded-full transition-all duration-500" style="width: 75%;"></div>
                </div>
            </div>

            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-slate-300">Spin & Turn Rating</span>
                    <span id="spinVal" class="font-bold text-teal-400">Low</span>
                </div>
                <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden">
                    <div id="spinBar" class="bg-teal-400 h-full rounded-full transition-all duration-500" style="width: 30%;"></div>
                </div>
            </div>
        </div>

        <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 mt-4">
            <span class="text-xs uppercase font-semibold text-slate-400 block mb-1">Recommended Strategy</span>
            <p id="strategyText" class="text-xs text-slate-200 leading-relaxed">
                Win toss and elect to bowl first. Dew might impact in late second innings.
            </p>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('pwaInstallBtn');
            btn.classList.remove('hidden');
            btn.addEventListener('click', () => {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => btn.classList.add('hidden'));
            });
        });

        function calculateMetrics() {
            const temp = parseFloat(document.getElementById('tempInput').value) || 30;
            const humidity = parseFloat(document.getElementById('humidityInput').value) || 50;
            const pitch = document.getElementById('pitchTypeInput').value;
            const innings = document.getElementById('inningsInput').value;

            let dewScore = Math.min(100, Math.max(0, (humidity * 1.1) - (temp * 0.8)));
            let paceScore = 50;
            let spinScore = 50;

            if (pitch === 'grassy') { paceScore += 35; spinScore -= 20; }
            else if (pitch === 'red_clay') { spinScore += 35; paceScore += 10; }
            else if (pitch === 'dry_flat') { spinScore += 20; paceScore -= 20; }
            else if (pitch === 'black_soil') { paceScore += 15; spinScore += 10; }

            if (innings === '2nd' && dewScore > 60) spinScore -= 25;

            paceScore = Math.min(100, Math.max(10, paceScore));
            spinScore = Math.min(100, Math.max(10, spinScore));

            document.getElementById('dewBar').style.width = dewScore + '%';
            document.getElementById('dewVal').innerText = dewScore > 65 ? 'High (Heavy)' : dewScore > 40 ? 'Moderate' : 'Low / None';

            document.getElementById('paceBar').style.width = paceScore + '%';
            document.getElementById('paceVal').innerText = paceScore > 70 ? 'High' : paceScore > 40 ? 'Moderate' : 'Low';

            document.getElementById('spinBar').style.width = spinScore + '%';
            document.getElementById('spinVal').innerText = spinScore > 70 ? 'High Turn' : spinScore > 40 ? 'Moderate' : 'Low Turn';

            let strategy = "Balanced pitch conditions. Standard game plan recommended.";
            if (dewScore > 60) {
                strategy = "Heavy dew expected in 2nd innings. Winning the toss and bowling first gives a massive advantage.";
            } else if (pitch === 'grassy') {
                strategy = "Pitch has green grass cover. Fast bowlers will get strong seam movement early in the match.";
            } else if (pitch === 'red_clay') {
                strategy = "Red clay pitch offers extra bounce and turn. Quality spinners and cutters will be effective.";
            }

            document.getElementById('strategyText').innerText = strategy;
        }
    </script>
</body>
  </html>
