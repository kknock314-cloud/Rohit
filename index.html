<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PitchStats Pro</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; touch-action: manipulation; }
        .card-bg { background-color: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto space-y-4 pb-12">

    <!-- Header -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-3">
        <div>
            <h1 class="text-lg font-black text-emerald-400">PITCHSTATS PRO</h1>
            <p class="text-[10px] text-slate-400">Match Analytics & Full Control</p>
        </div>
        <button onclick="openAddMatchModal()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1 shadow-lg shadow-emerald-500/20">
            <i class="fas fa-plus"></i> Add Match
        </button>
    </header>

    <!-- Controls & Selectors -->
    <div class="card-bg p-3 rounded-2xl space-y-3">
        <div>
            <div class="flex justify-between items-center mb-1">
                <label class="text-xs font-bold text-slate-400 uppercase"><i class="fas fa-stadium text-emerald-400 mr-1"></i> Stadium</label>
                <div class="space-x-2">
                    <button onclick="openModal('addStadiumModal')" class="text-[11px] text-emerald-400 font-bold hover:underline">+ Add</button>
                    <button onclick="openManageStadiumsModal()" class="text-[11px] text-amber-400 font-bold hover:underline"><i class="fas fa-edit"></i> Edit</button>
                </div>
            </div>
            <select id="stadiumSelect" onchange="renderApp()" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl p-2.5 font-medium"></select>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <div>
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[10px] text-slate-400 uppercase font-bold">Pitch No.</span>
                    <div class="space-x-1">
                        <button onclick="openModal('addPitchNoModal')" class="text-[10px] text-emerald-400 font-bold hover:underline">+Add</button>
                        <button onclick="openManagePitchNosModal()" class="text-[10px] text-amber-400 font-bold hover:underline"><i class="fas fa-edit"></i>Edit</button>
                    </div>
                </div>
                <select id="pitchNoSelect" onchange="renderApp()" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl p-2"></select>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[10px] text-slate-400 uppercase font-bold">Pitch Type</span>
                    <div class="space-x-1">
                        <button onclick="openModal('addPitchTypeModal')" class="text-[10px] text-emerald-400 font-bold hover:underline">+Add</button>
                        <button onclick="openManagePitchTypesModal()" class="text-[10px] text-amber-400 font-bold hover:underline"><i class="fas fa-edit"></i>Edit</button>
                    </div>
                </div>
                <select id="pitchTypeSelect" onchange="renderApp()" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl p-2"></select>
            </div>
        </div>

        <div class="relative">
            <i class="fas fa-search absolute left-3 top-2.5 text-slate-500 text-xs"></i>
            <input type="text" id="searchInput" oninput="renderApp()" placeholder="Search score, pitch, date..." class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl pl-8 pr-3 py-2">
        </div>
    </div>

    <!-- Analytics Dashboard -->
    <div class="grid grid-cols-2 gap-3">
        <div class="card-bg p-3 rounded-2xl text-center">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Avg 1st Innings</span>
            <div id="avg1st" class="text-3xl font-black text-emerald-400 mt-1">0</div>
        </div>
        <div class="card-bg p-3 rounded-2xl text-center">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Avg 2nd Innings</span>
            <div id="avg2nd" class="text-3xl font-black text-blue-400 mt-1">0</div>
        </div>
    </div>

    <!-- Matches List -->
    <div class="card-bg p-3 rounded-2xl space-y-2">
        <div class="flex justify-between items-center mb-2">
            <h3 class="text-xs font-bold text-slate-300 uppercase">Match Scorecards</h3>
            <span class="text-[10px] text-slate-400">Total: <strong id="matchCountText" class="text-emerald-400">0</strong></span>
        </div>
        <div id="matchesList" class="space-y-2"></div>
    </div>

    <!-- MODALS -->
    <div id="matchModal" class="hidden fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
        <div class="card-bg p-4 rounded-2xl w-full max-w-xs space-y-3">
            <h3 id="matchModalTitle" class="text-sm font-bold text-white border-b border-slate-800 pb-2">Add Match Record</h3>
            <input type="hidden" id="editingMatchIndex" value="-1">
            <div>
                <label class="text-[10px] text-slate-400 font-bold block mb-1">Match Date</label>
                <input type="date" id="modalMatchDate" class="w-full bg-slate-900 border border-slate-700 p-2 text-xs text-white rounded-xl">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-slate-400 font-bold block mb-1">Pitch No.</label>
                    <select id="modalPitchNo" class="w-full bg-slate-900 border border-slate-700 p-2 text-xs text-white rounded-xl"></select>
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 font-bold block mb-1">Pitch Type</label>
                    <select id="modalPitchType" class="w-full bg-slate-900 border border-slate-700 p-2 text-xs text-white rounded-xl"></select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-slate-400 font-bold block mb-1">1st Inn Runs</label>
                    <input type="number" id="m1Score" placeholder="185" class="w-full bg-slate-900 border border-slate-700 p-2 text-xs text-white rounded-xl">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 font-bold block mb-1">2nd Inn Runs</label>
                    <input type="number" id="m2Score" placeholder="170" class="w-full bg-slate-900 border border-slate-700 p-2 text-xs text-white rounded-xl">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal('matchModal')" class="px-3 py-1.5 text-xs bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                <button onclick="saveMatch()" class="px-4 py-1.5 text-xs bg-emerald-500 text-slate-950 font-bold rounded-lg">Save Match</button>
            </div>
        </div>
    </div>

    <!-- Add Stadium Modal -->
    <div id="addStadiumModal" class="hidden fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
        <div class="card-bg p-4 rounded-2xl w-full max-w-xs space-y-3">
            <h3 class="text-sm font-bold text-white">Add New Stadium</h3>
            <input type="text" id="newStadiumInput" placeholder="Stadium Name" class="w-full bg-slate-900 border border-slate-700 p-2 text-xs text-white rounded-xl">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('addStadiumModal')" class="px-3 py-1.5 text-xs bg-slate-800 rounded-lg">Cancel</button>
                <button onclick="addStadium()" class="px-3 py-1.5 text-xs bg-emerald-500 text-slate-950 font-bold rounded-lg">Save</button>
            </div>
        </div>
    </div>

    <!-- Manage Stadiums Modal -->
    <div id="manageStadiumsModal" class="hidden fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
        <div class="card-bg p-4 rounded-2xl w-full max-w-xs space-y-3 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="text-sm font-bold text-white">Edit Stadium Names</h3>
                <button onclick="closeModal('manageStadiumsModal')" class="text-slate-400 text-xs"><i class="fas fa-times"></i></button>
            </div>
            <div id="stadiumsEditList" class="space-y-2"></div>
        </div>
    </div>

    <!-- Add Pitch No Modal -->
    <div id="addPitchNoModal" class="hidden fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
        <div class="card-bg p-4 rounded-2xl w-full max-w-xs space-y-3">
            <h3 class="text-sm font-bold text-white">Add Pitch Number</h3>
            <input type="text" id="newPitchNoInput" placeholder="e.g. Pitch 5" class="w-full bg-slate-900 border border-slate-700 p-2 text-xs text-white rounded-xl">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('addPitchNoModal')" class="px-3 py-1.5 text-xs bg-slate-800 rounded-lg">Cancel</button>
                <button onclick="addPitchNo()" class="px-3 py-1.5 text-xs bg-emerald-500 text-slate-950 font-bold rounded-lg">Save</button>
            </div>
        </div>
    </div>

    <!-- Manage Pitch Numbers Modal -->
    <div id="managePitchNosModal" class="hidden fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
        <div class="card-bg p-4 rounded-2xl w-full max-w-xs space-y-3 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="text-sm font-bold text-white">Edit Pitch Numbers</h3>
                <button onclick="closeModal('managePitchNosModal')" class="text-slate-400 text-xs"><i class="fas fa-times"></i></button>
            </div>
            <div id="pitchNosEditList" class="space-y-2"></div>
        </div>
    </div>

    <!-- Add Pitch Type Modal -->
    <div id="addPitchTypeModal" class="hidden fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
        <div class="card-bg p-4 rounded-2xl w-full max-w-xs space-y-3">
            <h3 class="text-sm font-bold text-white">Add Pitch Type</h3>
            <input type="text" id="newPitchTypeInput" placeholder="e.g. Red Soil" class="w-full bg-slate-900 border border-slate-700 p-2 text-xs text-white rounded-xl">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('addPitchTypeModal')" class="px-3 py-1.5 text-xs bg-slate-800 rounded-lg">Cancel</button>
                <button onclick="addPitchType()" class="px-3 py-1.5 text-xs bg-emerald-500 text-slate-950 font-bold rounded-lg">Save</button>
            </div>
        </div>
    </div>

    <!-- Manage Pitch Types Modal -->
    <div id="managePitchTypesModal" class="hidden fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
        <div class="card-bg p-4 rounded-2xl w-full max-w-xs space-y-3 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="text-sm font-bold text-white">Edit Pitch Types</h3>
                <button onclick="closeModal('managePitchTypesModal')" class="text-slate-400 text-xs"><i class="fas fa-times"></i></button>
            </div>
            <div id="pitchTypesEditList" class="space-y-2"></div>
        </div>
    </div>

    <script>
        let stadiums = JSON.parse(localStorage.getItem('ps_stadiums')) || ["Wankhede Stadium", "Chinnaswamy Stadium"];
        let pitchNos = JSON.parse(localStorage.getItem('ps_pitchnos')) || ["Pitch 1", "Pitch 2", "Pitch 3"];
        let pitchTypes = JSON.parse(localStorage.getItem('ps_pitchtypes')) || ["Red Soil", "Black Soil"];
        let matches = JSON.parse(localStorage.getItem('ps_matches')) || [];

        function saveData() {
            localStorage.setItem('ps_stadiums', JSON.stringify(stadiums));
            localStorage.setItem('ps_pitchnos', JSON.stringify(pitchNos));
            localStorage.setItem('ps_pitchtypes', JSON.stringify(pitchTypes));
            localStorage.setItem('ps_matches', JSON.stringify(matches));
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function populateDropdowns() {
            const stSelect = document.getElementById('stadiumSelect');
            stSelect.innerHTML = stadiums.map(s => `<option value="${s}">${s}</option>`).join('');

            const pNoSelect = document.getElementById('pitchNoSelect');
            pNoSelect.innerHTML = `<option value="ALL">All Pitch Nos</option>` + pitchNos.map(p => `<option value="${p}">${p}</option>`).join('');
            document.getElementById('modalPitchNo').innerHTML = pitchNos.map(p => `<option value="${p}">${p}</option>`).join('');

            const pTypeSelect = document.getElementById('pitchTypeSelect');
            pTypeSelect.innerHTML = `<option value="ALL">All Pitch Types</option>` + pitchTypes.map(t => `<option value="${t}">${t}</option>`).join('');
            document.getElementById('modalPitchType').innerHTML = pitchTypes.map(t => `<option value="${t}">${t}</option>`).join('');
        }

        function addStadium() {
            const val = document.getElementById('newStadiumInput').value.trim();
            if (val && !stadiums.includes(val)) {
                stadiums.push(val);
                saveData();
                populateDropdowns();
                closeModal('addStadiumModal');
                document.getElementById('newStadiumInput').value = '';
                renderApp();
            }
        }

        function openManageStadiumsModal() {
            const list = document.getElementById('stadiumsEditList');
            list.innerHTML = stadiums.map((s, idx) => `
                <div class="flex gap-2 items-center">
                    <input type="text" value="${s}" id="stadium_edit_${idx}" class="w-full bg-slate-900 border border-slate-700 p-1.5 text-xs text-white rounded-lg">
                    <button onclick="saveEditedStadium(${idx})" class="bg-amber-500 text-slate-950 font-bold px-2 py-1.5 rounded-lg text-xs"><i class="fas fa-save"></i></button>
                </div>
            `).join('');
            openModal('manageStadiumsModal');
        }

        function saveEditedStadium(idx) {
            const newVal = document.getElementById(`stadium_edit_${idx}`).value.trim();
            if (newVal) {
                const oldVal = stadiums[idx];
                stadiums[idx] = newVal;
                matches.forEach(m => { if (m.stadium === oldVal) m.stadium = newVal; });
                saveData();
                populateDropdowns();
                openManageStadiumsModal();
                renderApp();
            }
        }

        function addPitchNo() {
            const val = document.getElementById('newPitchNoInput').value.trim();
            if (val && !pitchNos.includes(val)) {
                pitchNos.push(val);
                saveData();
                populateDropdowns();
                closeModal('addPitchNoModal');
                document.getElementById('newPitchNoInput').value = '';
            }
        }

        function openManagePitchNosModal() {
            const list = document.getElementById('pitchNosEditList');
            list.innerHTML = pitchNos.map((p, idx) => `
                <div class="flex gap-2 items-center">
                    <input type="text" value="${p}" id="pitchNo_edit_${idx}" class="w-full bg-slate-900 border border-slate-700 p-1.5 text-xs text-white rounded-lg">
                    <button onclick="saveEditedPitchNo(${idx})" class="bg-amber-500 text-slate-950 font-bold px-2 py-1.5 rounded-lg text-xs"><i class="fas fa-save"></i></button>
                </div>
            `).join('');
            openModal('managePitchNosModal');
        }

        function saveEditedPitchNo(idx) {
            const newVal = document.getElementById(`pitchNo_edit_${idx}`).value.trim();
            if (newVal) {
                const oldVal = pitchNos[idx];
                pitchNos[idx] = newVal;
                matches.forEach(m => { if (m.pitchNo === oldVal) m.pitchNo = newVal; });
                saveData();
                populateDropdowns();
                openManagePitchNosModal();
                renderApp();
            }
        }

        function addPitchType() {
            const val = document.getElementById('newPitchTypeInput').value.trim();
            if (val && !pitchTypes.includes(val)) {
                pitchTypes.push(val);
                saveData();
                populateDropdowns();
                closeModal('addPitchTypeModal');
                document.getElementById('newPitchTypeInput').value = '';
            }
        }

        function openManagePitchTypesModal() {
            const list = document.getElementById('pitchTypesEditList');
            list.innerHTML = pitchTypes.map((t, idx) => `
                <div class="flex gap-2 items-center">
                    <input type="text" value="${t}" id="pitchType_edit_${idx}" class="w-full bg-slate-900 border border-slate-700 p-1.5 text-xs text-white rounded-lg">
                    <button onclick="saveEditedPitchType(${idx})" class="bg-amber-500 text-slate-950 font-bold px-2 py-1.5 rounded-lg text-xs"><i class="fas fa-save"></i></button>
                </div>
            `).join('');
            openModal('managePitchTypesModal');
        }

        function saveEditedPitchType(idx) {
            const newVal = document.getElementById(`pitchType_edit_${idx}`).value.trim();
            if (newVal) {
                const oldVal = pitchTypes[idx];
                pitchTypes[idx] = newVal;
                matches.forEach(m => { if (m.pitchType === oldVal) m.pitchType = newVal; });
                saveData();
                populateDropdowns();
                openManagePitchTypesModal();
                renderApp();
            }
        }

        function openAddMatchModal() {
            document.getElementById('matchModalTitle').innerText = "Add Match Record";
            document.getElementById('editingMatchIndex').value = "-1";
            document.getElementById('m1Score').value = '';
            document.getElementById('m2Score').value = '';
            document.getElementById('modalMatchDate').value = new Date().toISOString().split('T')[0];
            openModal('matchModal');
        }

        function editMatch(index) {
            const match = matches[index];
            document.getElementById('matchModalTitle').innerText = "Edit Match Record";
            document.getElementById('editingMatchIndex').value = index;
            document.getElementById('modalMatchDate').value = match.date || new Date().toISOString().split('T')[0];
            document.getElementById('modalPitchNo').value = match.pitchNo;
            document.getElementById('modalPitchType').value = match.pitchType;
            document.getElementById
