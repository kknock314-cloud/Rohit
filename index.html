<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PitchStats Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#070a10">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #070a10; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
        .card-bg { background-color: #0f172a; border: 1px solid #1e293b; }
        .btn-green { background-color: #059669; color: white; }
        .btn-green:hover { background-color: #10b981; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <!-- Header Section -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold tracking-wider text-green-500">PITCHSTATS PRO</h1>
            <p id="user-status" class="text-xs text-gray-400 font-mono uppercase">CHECKING LOGIN...</p>
        </div>
        <button id="auth-btn" onclick="handleAuth()" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg text-sm font-semibold transition">
            Login
        </button>
    </div>

    <!-- Controls Section -->
    <div class="card-bg p-4 rounded-xl mb-4 space-y-3">
        <div>
            <label class="text-xs text-gray-400 font-semibold uppercase">📍 STADIUM SELECT</label>
            <select id="stadium-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm mt-1 focus:outline-none focus:border-green-500">
                <option value="all">All Stadiums</option>
            </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="text-xs text-gray-400 font-semibold uppercase">PITCH NO.</label>
                <select id="pitch-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm mt-1 focus:outline-none focus:border-green-500">
                    <option value="all">All Pitches</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-gray-400 font-semibold uppercase">PITCH TYPE</label>
                <select id="type-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm mt-1 focus:outline-none focus:border-green-500">
                    <option value="all">All Types</option>
                </select>
            </div>
        </div>
        <div class="flex justify-between items-center pt-2 text-xs text-gray-400">
            <span>Total Matches: <strong id="total-matches" class="text-amber-400">0</strong></span>
            <span class="text-emerald-400 font-mono">☁ Firestore Active</span>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="card-bg p-4 rounded-xl text-center">
            <p class="text-xs text-gray-400 uppercase font-semibold">AVG 1ST INNINGS</p>
            <h2 id="avg-1st" class="text-3xl font-extrabold text-emerald-400 my-1">0</h2>
            <p class="text-[10px] text-gray-500">Pahli Paari Avg Score</p>
        </div>
        <div class="card-bg p-4 rounded-xl text-center">
            <p class="text-xs text-gray-400 uppercase font-semibold">AVG 2ND INNINGS</p>
            <h2 id="avg-2nd" class="text-3xl font-extrabold text-blue-400 my-1">0</h2>
            <p class="text-[10px] text-gray-500">Dusri Paari Avg Score</p>
        </div>
    </div>

    <!-- Win Rate Cards -->
    <div class="card-bg p-4 rounded-xl mb-4 space-y-3">
        <div class="flex justify-between text-xs font-semibold">
            <span class="text-gray-400">1ST BAT WIN %</span>
            <span id="win-1st-percent" class="text-blue-400">0%</span>
        </div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
            <div id="bar-1st" class="bg-blue-500 h-full w-0 transition-all duration-500"></div>
        </div>

        <div class="flex justify-between text-xs font-semibold pt-1">
            <span class="text-gray-400">2ND BAT (CHASE) %</span>
            <span id="win-2nd-percent" class="text-amber-400">0%</span>
        </div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
            <div id="bar-2nd" class="bg-amber-500 h-full w-0 transition-all duration-500"></div>
        </div>
    </div>

    <!-- Action Button -->
    <button onclick="addNewMatch()" class="w-full btn-green font-bold py-3 rounded-xl mb-6 shadow-lg shadow-green-900/20 active:scale-95 transition">
        + Add New Match Scorecard
    </button>

    <!-- Scorecards Feed -->
    <div class="space-y-3">
        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Saved Scorecards History</h3>
        <div id="scorecard-list" class="space-y-2">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script>
        // Service Worker Registration for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
        }

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-YOUR-API-KEY-HERE",
            authDomain: "pitch-stats.firebaseapp.com",
            projectId: "pitch-stats",
            storageBucket: "pitch-stats.appspot.com",
            messagingSenderId: "107123456789",
            appId: "1:107123456789:web:abcdef123456"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();
        let matches = [];

        // Check redirect result when page reloads after login
        auth.getRedirectResult().catch(err => {
            alert('Login Error: ' + err.message);
        });

        // Auth State Listener
        auth.onAuthStateChanged(user => {
            const btn = document.getElementById('auth-btn');
            const status = document.getElementById('user-status');
            if (user) {
                btn.innerText = 'Logout';
                btn.className = 'px-4 py-2 bg-slate-800 hover:bg-slate-700 text-red-400 rounded-lg text-sm font-semibold transition border border-slate-700';
                status.innerText = user.displayName || user.email;
                loadMatches(user.uid);
            } else {
                btn.innerText = 'Login';
                btn.className = 'px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg text-sm font-semibold transition';
                status.innerText = 'NOT LOGGED IN';
                matches = [];
                renderUI();
            }
        });

        function handleAuth() {
            if (auth.currentUser) {
                auth.signOut();
            } else {
                const provider = new firebase.auth.GoogleAuthProvider();
                // Using Redirect instead of Popup to bypass browser popup blockers completely
                auth.signInWithRedirect(provider).catch(err => {
                    alert('Login Error: ' + err.message);
                });
            }
        }

        function loadMatches(uid) {
            db.collection('users').doc(uid).collection('matches')
                .onSnapshot(snapshot => {
                    matches = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderUI();
                }, err => {
                    console.error("Firestore Error: ", err);
                });
        }

        function renderUI() {
            document.getElementById('total-matches').innerText = matches.length;
            
            let avg1 = 0, avg2 = 0, win1 = 0, win2 = 0;
            if (matches.length > 0) {
                avg1 = Math.round(matches.reduce((acc, m) => acc + (Number(m.score1) || 0), 0) / matches.length);
                avg2 = Math.round(matches.reduce((acc, m) => acc + (Number(m.score2) || 0), 0) / matches.length);
                win1 = matches.filter(m => m.winner === '1st').length;
                win2 = matches.filter(m => m.winner === '2nd').length;
            }

            document.getElementById('avg-1st').innerText = avg1;
            document.getElementById('avg-2nd').innerText = avg2;

            const p1 = matches.length ? Math.round((win1 / matches.length) * 100) : 0;
            const p2 = matches.length ? Math.round((win2 / matches.length) * 100) : 0;

            document.getElementById('win-1st-percent').innerText = p1 + '%';
            document.getElementById('win-2nd-percent').innerText = p2 + '%';
            document.getElementById('bar-1st').style.width = p1 + '%';
            document.getElementById('bar-2nd').style.width = p2 + '%';

            const list = document.getElementById('scorecard-list');
            if (matches.length === 0) {
                list.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">No matches recorded yet. Click above to add.</p>`;
                return;
            }

            list.innerHTML = matches.map(m => `
                <div class="card-bg p-3 rounded-lg flex justify-between items-center border-l-4 border-emerald-500">
                    <div>
                        <p class="font-bold text-sm">${m.stadium || 'Stadium'}</p>
                        <p class="text-xs text-gray-400">1st: <span class="text-emerald-400">${m.score1 || 0}</span> | 2nd: <span class="text-blue-400">${m.score2 || 0}</span></p>
                    </div>
                    <button onclick="deleteMatch('${m.id}')" class="text-xs text-red-500 p-1 hover:bg-slate-800 rounded">🗑</button>
                </div>
            `).join('');
        }

        function addNewMatch() {
            if (!auth.currentUser) {
                alert('Pehle Login karo!');
                return;
            }
            const stadium = prompt('Stadium Name:');
            if (!stadium) return;
            const score1 = prompt('1st Innings Score:');
            const score2 = prompt('2nd Innings Score:');
            const winner = prompt('Winner? (Type 1st or 2nd):');

            if (score1 && score2) {
                db.collection('users').doc(auth.currentUser.uid).collection('matches').add({
                    stadium, 
                    score1: Number(score1), 
                    score2: Number(score2), 
                    winner: winner || '1st', 
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(err => alert('Error saving: ' + err.message));
            }
        }

        function deleteMatch(id) {
            if (auth.currentUser && confirm('Delete scorecard?')) {
                db.collection('users').doc(auth.currentUser.uid).collection('matches').doc(id).delete();
            }
        }
    </script>
</body>
              </html>
