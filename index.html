<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Stream Player PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

    <!-- Header -->
    <header class="p-4 bg-gray-800 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold text-green-400">Stream Player PWA</h1>
        <button id="install-btn" class="hidden bg-green-500 text-black px-3 py-1 rounded text-sm font-semibold">Install App</button>
    </header>

    <!-- Main Content Input Area -->
    <main class="flex-1 p-4 flex flex-col gap-4 max-w-xl mx-auto w-full">
        <div class="flex gap-2">
            <input type="text" id="yt-link-input" placeholder="YouTube link, .m3u8, ya koi bhi stream URL dalein..." class="flex-1 p-3 rounded bg-gray-800 border border-gray-700 text-white focus:outline-none focus:border-green-500 text-sm">
            <button onclick="loadYouTubeLive()" class="bg-green-500 text-black font-semibold px-5 py-3 rounded hover:bg-green-400 transition">Play</button>
        </div>
        <p class="text-xs text-gray-400">Tip: Aap is page ko mobile menu se "Add to Home Screen" ya "Install App" karke Kick app jaisa chala sakte hain.</p>
    </main>

    <!-- Draggable / Floating Video Container -->
    <div id="yt-player-container" class="hidden fixed bottom-4 right-4 w-80 h-48 bg-black rounded-lg shadow-2xl border border-gray-700 overflow-hidden z-50 flex flex-col">
        <!-- Drag Handle & Controls Bar -->
        <div id="drag-handle" class="bg-gray-800 px-3 py-1.5 flex justify-between items-center cursor-move select-none">
            <span class="text-xs text-gray-300 font-medium">Player</span>
            <div class="flex items-center gap-2">
                <button id="pip-btn" onclick="togglePiP()" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-0.5 rounded text-white">PiP</button>
                <button onclick="closePlayer()" class="text-red-400 hover:text-red-300 font-bold px-1 text-sm">&times;</button>
            </div>
        </div>
        <!-- Player Target Area -->
        <div class="flex-1 relative w-full h-full bg-black">
            <div id="player" class="w-full h-full"></div>
        </div>
    </div>

    <!-- YouTube API Script -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- Custom Logic Script -->
    <script src="script.js"></script>
</body>
</html>
